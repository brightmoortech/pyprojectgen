
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprojectgen"
version = "0.2.1"
description = "A reproducible Python project environment generator for macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Haitham BouZeineddine" }
]

[project.scripts]
pyprojectgen = "pyprojectgen:main"

[tool.setuptools]
py-modules = [
    "pyprojectgen",
    "config",
    "models",
    "preflight",
    "project_structure",
    "python_env",
    "project_files",
    "git_ops",
    "github_ops",
    "stage",
    "workflow",
]
